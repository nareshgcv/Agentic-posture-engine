name: "Agentic Posture Engine (APE) Linter"
description: "Scan agent configurations, prompt files, and code ASTs for security risks."
author: "nareshgcv"

branding:
  icon: "shield"
  color: "blue"

inputs:
  scan_path:
    description: "Directory or file path to scan"
    required: false
    default: "."
  sarif_output:
    description: "Path where the SARIF report will be saved"
    required: false
    default: "ape-results.sarif"

outputs:
  sarif_file:
    description: "Path to the generated SARIF file"
    value: ${{ inputs.sarif_output }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ${{ github.action_path }}/src/ape-linter

    - name: Run APE Linter
      shell: bash
      run: |
        python -m ape_linter \
          --path "${{ inputs.scan_path }}" \
          --output "${{ inputs.sarif_output }}" 
