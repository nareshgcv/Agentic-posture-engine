[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-posture-engine"
version = "1.0.0"
description = "Static Linter, Auto-Fixer & PR Analyzer for AI Agent Security Postures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ruamel.yaml>=0.19.1"
]

[project.scripts]
ape = "ape_linter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
